name: Update draw data

on:
  schedule:
    # Every 30 minutes, 12:00–23:30 UTC on weekdays (covers Toronto business hours).
    - cron: "*/30 12-23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  update-draws:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@10.9.2
      - run: npm ci
      - run: npm run update:data
      - run: npm run check
      - name: Commit changed datasets
        id: commit
        run: |
          git add -- data/ee-draws.json data/ee-draws-fr.json data/distribution.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m '[bot] Update Express Entry datasets'
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # GITHUB_TOKEN commits do not trigger push workflows. A configured deployment
      # runs here explicitly so refreshed bundled data reaches the live Worker.
      - name: Deploy refreshed data
        if: steps.commit.outputs.changed == 'true' && vars.CLOUDFLARE_ACCOUNT_ID != ''
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
